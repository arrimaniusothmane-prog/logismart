# LogiSmart frontend — nginx
# SPA (fallback index.html) + proxy des flux vers l'API (même origine =>
# aucun CORS, cookies httpOnly transmis sans friction, prêt pour socket.io).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Capacité de payload pour les uploads (preuves de livraison, CV).
  client_max_body_size 12m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
  }

  # Temps réel (Phase 3 — positions des livreurs, chat support).
  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Cache immuable pour les assets hachés par Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA : toutes les routes non statiques retombent sur index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}